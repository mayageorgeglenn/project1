<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f8f8f8"/>

  <!-- Rear wheel -->
  <circle cx="108" cy="272" r="68" stroke="#000" stroke-width="7"/>
  <circle cx="108" cy="272" r="6"  fill="#000"/>

  <!-- Front wheel -->
  <circle cx="292" cy="272" r="68" stroke="#000" stroke-width="7"/>
  <circle cx="292" cy="272" r="6"  fill="#000"/>

  <!-- Chain stay: BB to rear axle -->
  <line x1="200" y1="272" x2="108" y2="272" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Seat tube: BB to seat cluster -->
  <line x1="200" y1="272" x2="174" y2="155" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Seat stay: seat cluster to rear axle -->
  <line x1="174" y1="155" x2="108" y2="272" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Top tube: seat cluster to head tube top -->
  <line x1="174" y1="155" x2="288" y2="168" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Down tube: BB to head tube bottom -->
  <line x1="200" y1="272" x2="284" y2="218" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Head tube -->
  <line x1="288" y1="168" x2="284" y2="218" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Fork: head tube bottom to front axle -->
  <line x1="284" y1="218" x2="292" y2="272" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Seat -->
  <line x1="152" y1="150" x2="200" y2="150" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Handlebar stem + bar -->
  <line x1="288" y1="168" x2="295" y2="145" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <line x1="282" y1="145" x2="314" y2="145" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Crank arm -->
  <line x1="200" y1="272" x2="218" y2="295" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="218" cy="295" r="5" fill="#000"/>
</svg>
